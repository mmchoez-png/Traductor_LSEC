<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abecedario LSEC — Traductor en tiempo real</title>
  <meta name="description" content="Traductor en tiempo real del abecedario de Lengua de Señas Ecuatoriana (LSEC) con MediaPipe y lectura por voz." />

  <!-- Tipografía redondeada y legible (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- Dependencias MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- Motor ONNX Runtime Web (requerido por lsec_model.onnx) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>

  <!-- Lógica de inferencia 3D y voz -->
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-container app-container--workspace">
    <!-- App Top Bar compacta -->
    <header class="workspace-topbar">
      <a href="index.html" class="pill-back-btn" aria-label="Volver al inicio">
        <span aria-hidden="true">←</span>
        <span>Inicio</span>
      </a>

      <h1 class="workspace-title">Abecedario LSEC</h1>

      <button type="button" id="btn-help-tip" class="help-circle-btn" onclick="alternarConsejoCondor()" aria-expanded="false" aria-controls="condor-quick-tip" aria-label="Mostrar u ocultar consejo rápido">
        💡
      </button>
    </header>

    <!-- Consejo rápido del Cóndor (desplegable bajo demanda) -->
    <aside id="condor-quick-tip" class="quick-tip-banner" hidden>
      <div class="mini-condor-box" aria-hidden="true">
        <img src="images/condor_logo.jpg" alt="Cóndor guía LSEC" class="mini-condor-img" />
      </div>
      <span><strong>Tip de tu guía:</strong> Buena luz, centra tu mano en el marco y mantén la seña 1 segundo antes de pulsar <strong>+ Letra</strong>.</span>
      <button type="button" class="quick-tip-close" onclick="alternarConsejoCondor()" aria-label="Cerrar consejo">✕</button>
    </aside>

    <!-- Visor de Cámara estilo HUD -->
    <section class="video-wrapper" aria-label="Visor de cámara para señas">
      <div class="camera-placeholder" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
          <circle cx="12" cy="13" r="3" />
        </svg>
        <span>Iniciando cámara...</span>
      </div>

      <!-- IDs y dimensiones nativas 640x480 requeridos por app.js -->
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>

      <!-- Botón flotante glassmorphism para toggleCamera() -->
      <button type="button" class="hud-toggle-btn" onclick="toggleCamera()" aria-label="Cambiar cámara frontal o trasera">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
          <circle cx="12" cy="13" r="3" />
        </svg>
        <span>Cámara</span>
      </button>
    </section>

    <!-- Tarjeta de Detección + Mini-Avatar Panorámico del Cóndor -->
    <section class="detection-card" aria-live="polite" aria-label="Resultado de detección">
      <div class="mini-condor-box">
        <img src="images/condor_logo.jpg" alt="Cóndor guía LSEC" class="mini-condor-img" />
      </div>

      <div class="detection-details">
        <div class="detection-header-row">
          <span class="detection-kicker">Detección en tiempo real</span>
          <span id="output-confidence" class="confidence-pill">Confianza: --</span>
        </div>
        <div id="output-class" class="detection-class">Iniciando sistema...</div>
      </div>
    </section>

    <!-- Constructor de Palabras estilo pizarra moderna -->
    <section class="board-card" aria-label="Constructor de palabras">
      <div class="board-header">
        <span>Pizarra de traducción</span>
        <span class="board-sub">Construye tu oración</span>
      </div>
      <div class="board-surface">
        <div id="sentence-display">...</div>
      </div>
    </section>

    <!-- Panel de Controles Ergonómicos (Grid compacto de 2 filas) -->
    <nav class="controls-grid" aria-label="Controles de escritura y voz">
      <!-- Fila 1 (3 columnas) -->
      <div class="controls-row-1">
        <button type="button" class="btn-action btn-action--primary-soft" onclick="agregarLetraDetectada()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>+ Letra</span>
        </button>

        <button type="button" class="btn-action btn-action--neutral" onclick="agregarEspacio()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 17v1c0 .5-.5 1-1 1H3c-.5 0-1-.5-1-1v-1" />
          </svg>
          <span>Espacio</span>
        </button>

        <button type="button" class="btn-action btn-action--neutral" onclick="borrarPalabra()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
            <line x1="18" y1="9" x2="12" y2="15" />
            <line x1="12" y1="9" x2="18" y2="15" />
          </svg>
          <span>Borrar</span>
        </button>
      </div>

      <!-- Fila 2 (2 columnas) -->
      <div class="controls-row-2">
        <button type="button" class="btn-action btn-action--clear" onclick="limpiarTexto()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          </svg>
          <span>Limpiar</span>
        </button>

        <button type="button" class="btn-action btn-action--speak" onclick="leerOracion()">
          <span aria-hidden="true">🔊</span>
          <span>Leer Oración</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    function alternarConsejoCondor() {
      const banner = document.getElementById('condor-quick-tip');
      const btn = document.getElementById('btn-help-tip');
      if (!banner || !btn) return;
      const estaOculto = banner.hasAttribute('hidden');
      if (estaOculto) {
        banner.removeAttribute('hidden');
        btn.setAttribute('aria-expanded', 'true');
      } else {
        banner.setAttribute('hidden', '');
        btn.setAttribute('aria-expanded', 'false');
      }
    }
  </script>
</body>
</html>
